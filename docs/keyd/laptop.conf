# /etc/keyd/laptop.conf — managed by ~/linux-dotfiles/docs/keyd/
#
# Dell Latitude 7450 internal keyboard ONLY. These remaps exist to give the
# laptop a Mac-style modifier layout; external keyboards (e.g. the Magi65)
# keep their stock modifier layout and never see this file.

[ids]
# "AT Translated Set 2 keyboard" on the i8042 controller — the built-in
# keyboard. This id (bus 0011, vendor 0001, product 0001) is stable.
# Verify with: sudo keyd monitor
0001:0001

[main]

# CapsLock: hold = Control, tap = Escape.
# MUST be repeated here: keyd assigns each device to exactly ONE config file
# (explicit id beats the wildcard — see lookup_config_ent in daemon.c), so
# this keyboard does NOT inherit default.conf's capslock binding.
capslock = overload(control, esc)

# Modifier remaps: Mac-style layout on the Dell Latitude 7450.
#
# Right Alt → Control.
# Left Alt  → Meta/Super (for niri compositor shortcuts).
# Windows   → Alt (the key left of leftalt; firmware identifies it as leftmeta).
#
# These are simple layer bindings in [main]. keyd evaluates chords FIRST
# (on physical key names, pre-remap), so the Copilot chord below is unaffected
# by remapping leftmeta here — the chord swallows the physical leftmeta before
# the individual binding ever fires.
rightalt = layer(control)
leftalt = layer(meta)
leftmeta = layer(alt)
rightcontrol = layer(alt)

# Space: hold = numpad layer (200ms), tap = space.
# overloadt adds a 200ms delay before activating the layer, preventing
# accidental activation during fast typing where Space overlaps the next key.
space = overloadt(numpad, space, 200)
[numpad]

u = 7
i = 8
o = 9
j = 4
k = 5
l = 6
m = 1
comma = 2
dot = 3

n = 0
p = minus
leftbrace = equal
rightbrace = grave
